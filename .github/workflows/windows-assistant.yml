name: Build Windows 11 Assistant
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-assistant/**'
      - '.github/workflows/windows-assistant.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tesseract OCR
        shell: powershell
        run: choco install tesseract --yes --no-progress
      - name: Install Python packages
        working-directory: windows-assistant
        run: python -m pip install -r requirements.txt
      - name: Package app with OCR engine
        shell: powershell
        working-directory: windows-assistant
        run: |
          $tess = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path "$tess\tesseract.exe")) { throw 'Tesseract installation not found' }
          New-Item -ItemType Directory -Force -Path tesseract | Out-Null
          Copy-Item "$tess\*" tesseract -Recurse -Force
          pyinstaller --noconfirm --clean --windowed --onedir --name iGOT-Smart-Learning --add-data "tesseract;tesseract" --collect-all keyring --collect-all pytesseract main.py
      - uses: actions/upload-artifact@v4
        with:
          name: iGOT-Smart-Learning-Windows11
          path: windows-assistant/dist/iGOT-Smart-Learning/
          if-no-files-found: error
          retention-days: 14
